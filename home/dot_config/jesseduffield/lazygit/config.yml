# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

os:
  # May have to add to $PATH for commands to work
  open: 'subl {{filename}}'
  edit: 'code {{filename}}'
  editAtLine: 'code --line={{line}} {{filename}}'
  editAtLineAndWait: 'code --block --line={{line}} {{filename}}'
  # editInTerminal: true
  openDirInEditor: 'marta {{dir}}'

git:
  branchPrefix: "yl/"

